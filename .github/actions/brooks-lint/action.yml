name: "Brooks-Lint Review"
description: "Run brooks-lint on PR changes and post results as a PR comment"
author: "hyhmrright"

inputs:
  mode:
    description: "Review mode: review, audit, debt, test, health, sweep"
    default: "review"
  anthropic-api-key:
    description: "Anthropic API key (set this or opencode-api-key, exactly one)"
    required: false
  opencode-api-key:
    description: "OpenCode API key (Zen or Go) to run non-Anthropic models over OpenAI-compatible chat completions"
    required: false
  fail-below:
    description: "Fail the check if Health Score is below this threshold (0 = never fail)"
    default: "0"
  fail-on:
    description: "Fail the check on findings at/above this severity: none, warning, or critical"
    default: "none"
  fail-on-regression:
    description: "Fail the check if the Health Score dropped vs the last run (true/false)"
    default: "false"
  sarif-file:
    description: "Path to write a SARIF report for GitHub Code Scanning (empty = skip SARIF)"
    default: ""
  model:
    description: "Model id (default: claude-sonnet-4-6 with anthropic-api-key, kimi-k3 with opencode-api-key)"
    default: ""
  api-base-url:
    description: "Override the API base: an Anthropic-compatible /v1/messages endpoint in anthropic mode, or an OpenCode gateway base such as https://opencode.ai/zen/v1 in opencode mode (empty = provider default)"
    default: ""
  api-protocol:
    description: "OpenCode endpoint protocol: auto routes gpt-/grok-/muse- models to /responses and everything else to /chat/completions; set chat or responses to force it"
    default: "auto"

outputs:
  score:
    description: "Health Score from the review (0-100)"
    value: ${{ steps.score.outputs.score }}

branding:
  icon: "shield"
  color: "blue"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # github.action_path points at this directory (.github/actions/brooks-lint),
    # NOT at the checked-out action repository — but scripts/ and skills/ live at
    # the repo root, three levels up. Resolving the root once here is what makes
    # the paths below actually exist.
    - name: Resolve brooks-lint root
      shell: bash
      run: |
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        echo "BROOKS_LINT_ROOT=$root" >> "$GITHUB_ENV"
        # package.json is the single source of truth for the SDK version, so the
        # cache key and the install below can never pin different things.
        echo "BROOKS_LINT_SDK=$(node -p "require('$root/package.json').devDependencies['@anthropic-ai/sdk']")" >> "$GITHUB_ENV"

    - name: Configure provider
      id: provider
      shell: bash
      env:
        ANTHROPIC_KEY: ${{ inputs.anthropic-api-key }}
        OPENCODE_KEY: ${{ inputs.opencode-api-key }}
        MODEL_IN: ${{ inputs.model }}
        API_BASE_URL: ${{ inputs.api-base-url }}
      run: |
        # Exactly one key: mixing them would make the model default and the
        # dependency-install step disagree about which API this run talks to.
        if [ -n "$ANTHROPIC_KEY" ] && [ -n "$OPENCODE_KEY" ]; then
          echo "Set exactly one of anthropic-api-key or opencode-api-key" >&2
          exit 1
        fi
        if [ -z "$ANTHROPIC_KEY" ] && [ -z "$OPENCODE_KEY" ]; then
          echo "Set anthropic-api-key or opencode-api-key" >&2
          exit 1
        fi
        if [ -n "$OPENCODE_KEY" ]; then
          provider=opencode
          model="${MODEL_IN:-kimi-k3}"
          echo "OPENCODE_API_KEY=$OPENCODE_KEY" >> "$GITHUB_ENV"
          if [ -n "$API_BASE_URL" ]; then
            echo "OPENCODE_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          fi
        else
          provider=anthropic
          model="${MODEL_IN:-claude-sonnet-4-6}"
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_KEY" >> "$GITHUB_ENV"
          if [ -n "$API_BASE_URL" ]; then
            echo "ANTHROPIC_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"
          fi
        fi
        echo "provider=$provider" >> "$GITHUB_OUTPUT"
        echo "model=$model" >> "$GITHUB_OUTPUT"

    - name: Cache SDK
      id: cache
      if: steps.provider.outputs.provider == 'anthropic'
      uses: actions/cache@v4
      with:
        path: ${{ env.BROOKS_LINT_ROOT }}/node_modules
        key: brooks-lint-sdk-${{ runner.os }}-${{ env.BROOKS_LINT_SDK }}

    - name: Install dependencies
      if: steps.provider.outputs.provider == 'anthropic' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npm install --prefix "$BROOKS_LINT_ROOT" "@anthropic-ai/sdk@$BROOKS_LINT_SDK"

    - name: Run Brooks-Lint
      shell: bash
      env:
        PROVIDER: ${{ steps.provider.outputs.provider }}
        MODEL: ${{ steps.provider.outputs.model }}
        API_PROTOCOL: ${{ inputs.api-protocol }}
        SARIF_FILE: ${{ inputs.sarif-file }}
        MODE: ${{ inputs.mode }}
      run: |
        sarif_arg=()
        if [ -n "$SARIF_FILE" ]; then
          sarif_arg=(--sarif-out "$SARIF_FILE")
        fi
        node "$BROOKS_LINT_ROOT/scripts/ci-review.mjs" \
          --mode "$MODE" \
          --provider "$PROVIDER" \
          --model "$MODEL" \
          --api-protocol "$API_PROTOCOL" \
          --skills-dir "$BROOKS_LINT_ROOT/skills" \
          --project-dir "$GITHUB_WORKSPACE" \
          "${sarif_arg[@]}" \
          > brooks-lint-report.json

    - name: Parse Health Score
      shell: bash
      id: score
      run: |
        score=$(node --input-type=module -e "
          import { readFileSync } from 'fs';
          const r = JSON.parse(readFileSync('brooks-lint-report.json', 'utf8'));
          console.log(r.score ?? 0);
        ")
        echo "score=$score" >> "$GITHUB_OUTPUT"

    - name: Post PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('brooks-lint-report.json', 'utf8'));
          const trend = r.trend ? `\n\n**Trend:** ${r.trend}` : '';
          const body = `## Brooks-Lint Review\n\n${r.report}${trend}\n\n---\n_Automated by [brooks-lint](https://github.com/hyhmrright/brooks-lint)_`;
          await github.rest.issues.createComment({
            ...context.repo,
            issue_number: context.issue.number,
            body
          });

    - name: Upload SARIF
      if: inputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    # Inputs go through env, never straight into the script body: a caller wiring
    # an input to attacker-controlled text (a PR title, a branch name) would
    # otherwise be injecting shell here. Same reason as the Run step above.
    - name: Check Threshold
      if: inputs.fail-below != '0'
      shell: bash
      env:
        SCORE: ${{ steps.score.outputs.score }}
        FAIL_BELOW: ${{ inputs.fail-below }}
      run: |
        if [ "$SCORE" -lt "$FAIL_BELOW" ]; then
          echo "Health Score $SCORE is below threshold $FAIL_BELOW"
          exit 1
        fi

    - name: Quality Gates
      if: inputs.fail-on != 'none' || inputs.fail-on-regression == 'true'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        node "$BROOKS_LINT_ROOT/scripts/ci-gate.mjs" \
          --report brooks-lint-report.json \
          --fail-on "$FAIL_ON" \
          --fail-on-regression "$FAIL_ON_REGRESSION"
